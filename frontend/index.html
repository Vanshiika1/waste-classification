<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Classification</title>
</head>

<body>

    <h1>♻️ AI Waste Classification</h1>

    <p>
        Upload an image of waste and our AI model will classify it
        into one of six categories.
    </p>

    <h2>Waste Categories</h2>

    <ul>
        <li>Plastic</li>
        <li>Paper</li>
        <li>Glass</li>
        <li>Metal</li>
        <li>Cardboard</li>
        <li>Trash</li>
    </ul>

    <h2>Upload Waste Image</h2>

    <input type="file" accept="image/*">

    <br><br>

    <button>Classify Waste</button>

    <h2>Prediction</h2>

    <p>Prediction will appear here.</p>

</body>
</html>
